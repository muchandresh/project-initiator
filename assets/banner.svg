<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#121526" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>

    <linearGradient id="piGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="300" cy="200" r="180" fill="url(#accentGlow)" filter="url(#glow)" />
  <circle cx="900" cy="200" r="180" fill="url(#accentGlow)" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- PI! Massive Central Typography -->
  <g text-anchor="middle">
    <!-- Drop Glow for PI! -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="168" font-weight="900" letter-spacing="4" fill="url(#piGradient)" filter="url(#glow)" opacity="0.6">
      PI!
    </text>
    <!-- Crisp Foreground PI! -->
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="168" font-weight="900" letter-spacing="4" fill="url(#piGradient)">
      PI!
    </text>

    <!-- Subtitle & Protocol Tag -->
    <text x="600" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="20" font-weight="700" letter-spacing="8" fill="#e2e8f0">
      PROJECT INITIATOR
    </text>
    <text x="600" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#94a3b8">
      PRE-FLIGHT IDEA DISCOVERY • ARCHITECTURAL LOCK • CROSS-AGENT HANDOVER
    </text>
  </g>
</svg>
